# ── App name used in email templates ──────────────────────────────────────────
app.name=Attendance Management System

# ── Dynamic QR Configuration ──────────────────────────────────────────────────
# How long each QR token is valid (in minutes). Default = 2 minutes.
app.qr.token-validity-minutes=2

# Base URL embedded in QR code. Students open this URL after scanning.
# Change to your deployed domain in production.
app.qr.base-url=http://localhost:8080/attend

# Auto-rotate token when fewer than this many seconds remain. Default = 30s.
app.qr.rotation-threshold-seconds=30

# How often the rotation scheduler checks for expiring tokens (milliseconds).
# Default = 30000 (30 seconds).
app.qr.rotation-check-interval-ms=30000

# ── Faculty Attendance ────────────────────────────────────────────────────────
# College WiFi network range (CIDR notation). Faculty must be on this network to scan.
# Examples: 192.168.1.0/24  or  10.0.0.0/8  or  172.16.0.0/12
# Set to 0.0.0.0/0 to allow any IP (for testing only)
app.faculty.allowed-network=0.0.0.0/0

# Daily QR validity window — how many hours the daily QR is valid (default full day)
app.faculty.qr-validity-hours=24
